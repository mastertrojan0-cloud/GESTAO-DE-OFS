[project]
name = "ofs-feedback"
version = "1.0.0"
description = "Sistema OFC/OFS - Security Dynamics Backend"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
# Pytest configuration for Sistema OFC/OFS
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Timeouts (via pytest-timeout se instalado)
timeout = 120
timeout_method = "thread"

# Logging
log_cli = false
log_level = "WARNING"

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*cryptography.*:UserWarning",
]

# Markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "auth: authentication related tests",
    "ofc: OFC records related tests",
    "metrics: metrics related tests",
    "reports: PDF/reports related tests",
    "audit: audit log related tests",
    "permissions: RBAC permission tests",
]

# Environment variables for tests
env = [
    "JWT_SECRET=test-secret-key-at-least-32-chars-long-for-testing-only",
    "JWT_ALGORITHM=HS256",
    "ACCESS_TOKEN_EXPIRE_MINUTES=15",
    "REFRESH_TOKEN_EXPIRE_DAYS=7",
    "PASSWORD_EXPIRATION_DAYS=90",
    "PASSWORD_HISTORY_COUNT=5",
    "MAX_FAILED_ATTEMPTS=5",
    "LOCKOUT_MINUTES=30",
    "DB_HOST=localhost",
    "DB_PORT=5432",
    "DB_USER=ofs_app",
    "DB_PASSWORD=test_password",
    "DB_NAME=ofs_feedback_test",
    "DEBUG=false",
    "LOG_LEVEL=WARNING",
    "RATE_LIMIT_DEFAULT=1000/minute",
    "RATE_LIMIT_LOGIN=100/minute",
    "BACKUP_DIR=/tmp/ofs_test_backups",
]
