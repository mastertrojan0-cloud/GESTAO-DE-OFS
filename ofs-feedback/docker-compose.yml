services:
  # ================================================================
  # 1. NGINX — Proxy Reverso + Arquivos Estáticos do Frontend
  # ================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: ofs-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - ofs_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ================================================================
  # 2. BACKEND — FastAPI + Uvicorn + APScheduler (backup interno)
  # ================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ofs-backend
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./backups:/app/backups
      - ./reports:/app/reports
      - ./backend/static:/app/static:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ofs_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ================================================================
  # 3. POSTGRESQL — Banco de Dados
  # ================================================================
  db:
    image: postgres:16-alpine
    container_name: ofs-db
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-ofs_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ofs_feedback}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - ofs_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ofs_app} -d ${DB_NAME:-ofs_feedback}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local

networks:
  ofs_net:
    driver: bridge
